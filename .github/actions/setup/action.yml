name: Set up Navarch
description: Install pnpm (version from package.json `packageManager`), Node with the pnpm store cache, and the workspace dependencies.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24"
  install:
    description: Run `make install` after setting up the toolchain
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: make install
